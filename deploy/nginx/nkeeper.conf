# NKeeper (docs/architecture.md §8), installed by deploy/setup.sh as /etc/nginx/conf.d/nkeeper.conf.
# nginx terminates TLS and proxies everything to the server on loopback. It serves no files itself:
# the server serves the shell and the plugins' files, with its own security headers.
# @SERVER_NAMES@, @TLS_DIR@, @LISTEN_HTTP2@ and @HTTP2@ are filled in by the installer.

map $http_upgrade $nkeeper_connection {
    default upgrade;
    ''      close;
}

upstream nkeeper {
    server 127.0.0.1:5080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2: the installer writes `http2 on;` for nginx 1.25.1 and later, and `listen … http2` before it.
    listen 443 ssl@LISTEN_HTTP2@ default_server;
    listen [::]:443 ssl@LISTEN_HTTP2@ default_server;
    @HTTP2@
    server_name @SERVER_NAMES@;

    ssl_certificate     @TLS_DIR@/nkeeper.crt;
    ssl_certificate_key @TLS_DIR@/nkeeper.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:nkeeper:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The server caps its own messages; this caps request bodies.
    client_max_body_size 2m;

    location / {
        proxy_pass http://nkeeper;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nkeeper_connection;

        # Sessions are long-lived WebSockets; the server sends keep-alives every 30 seconds.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
