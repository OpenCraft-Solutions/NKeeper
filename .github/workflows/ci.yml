name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Building a plugin builds its frontend, so the backend build needs the npm packages too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages (from the lock file)
        run: npm ci

      - name: Restore (locked)
        run: dotnet restore NKeeper.slnx --locked-mode

      - name: Check formatting
        run: dotnet format NKeeper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NKeeper.slnx --no-restore --configuration Release

      # The build packs and signs the built-in plugins with a development key made fresh for this run
      # (plugin-security.md §10); each package must verify against it.
      - name: Verify the built-in plugin packages
        run: |
          shopt -s nullglob
          packages=(artifacts/plugins/*.nkp)
          if [ ${#packages[@]} -eq 0 ]; then echo "No plugin packages were built." >&2; exit 1; fi
          for package in "${packages[@]}"; do
            dotnet tools/NKeeper.PluginTool/bin/Release/net10.0/nkeeper-plugin.dll verify "$package" --trust .dev/keys --development
          done

      - name: Test
        run: dotnet test NKeeper.slnx --no-build --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from the lock file)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
