name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Building a plugin builds its frontend, so the backend build needs the npm packages too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages (from the lock file)
        run: npm ci

      - name: Restore (locked)
        run: dotnet restore NKeeper.slnx --locked-mode

      - name: Check formatting
        run: dotnet format NKeeper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NKeeper.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test NKeeper.slnx --no-build --configuration Release

  frontend:
    name: Frontend
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from the lock file)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Packs the packages core publishes and builds a sample plugin from them alone, outside the solution, so a
  # package that only works inside this repository fails here rather than in a plugin repository (architecture.md §9).
  package-smoke:
    name: Package smoke test
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages (from the lock file)
        run: npm ci

      - name: Pack the packages, then build and test the sample plugin from them
        run: testing/package-smoke/smoke.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
