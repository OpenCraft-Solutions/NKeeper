version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The type definitions must match the Node version NKeeper runs on (24 LTS, see .nvmrc), not the
      # newest Node: a major update would let code compile against APIs that don't exist at run time.
      # Raise this together with .nvmrc and package.json "engines".
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
